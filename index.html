<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="ポートフォリオサイト">
	<title>Portfolio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<header class="header">
		<div class="header__inner">
			<!-- ロゴ -->
			<a href="#top" class="header__brand">
				<img src="img/logo.svg" alt="" class="header__logo">
			</a>
		
			<!-- ハンバーガー -->
			<button class="header__toggle" aria-label="メニューを開く">
				<span class="header__line"></span>
				<span class="header__line"></span>
				<span class="header__line"></span>
			</button>
		</div>
	</header>

	<main>
		<section class="hero">
			<div>
				<img src="img/Bitmap.png" alt="">
			</div>
			<h5 class="hero__title">Gabriel Pires</h5>
			<h1 class="hero__heading">
				The Simple,<br>
				Clean<span class="u-sp-only"><br></span>
				Design
			</h1>
			<p class="hero__lead">
				Agency provides a full service range
				including technical skills, design,
				business understanding.
			</p>
		</section>
		
		<section class="service">
			<h5 class="service__title">Service</h5>
		</section>
		
		<section class="portfolio">
			<h5 class="portfolio__title">Portfolio</h5>
		</section>
		
		<section class="features">
			<h5 class="features__title">Features</h5>
		</section>
		
		<section class="testimonials">
			<h5 class="testimonials__title">Testimonials</h5>
		</section>
		
		<section class="faq">
			<h5 class="faq__title">FAQ</h5>
		</section>
		
		<section class="blog">
			<h5 class="blog__title">Our Blog</h5>
		</section>
		
		<section class="contact">
			<h5 class="contact__title">Contact</h5>
		</section>
	</main>
</body>
</html>
