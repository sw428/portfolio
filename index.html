<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="ポートフォリオサイト">
	<title>Portfolio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<header class="header">
		<div class="l-inner header__inner">
			<div class="header__controls">
				<!-- ロゴ -->
						<a href="#top" class="header__brand">
							<img src="img/logo.svg"  class="header__logo">
						</a>

				<!-- ハンバーガー -->
				<button class="header__toggle" aria-label="メニューを開く">
					<span class="header__line"></span>
					<span class="header__line"></span>
					<span class="header__line"></span>
				</button>
			</div>
		</div>
	</header>

	<main>
		<section class="hero">
			<div class="l-inner">
				<div>
					<img class="hero__avatar" src="img/Bitmap.png" alt="">
				</div>
				<p class="hero__title t-accent-text">Gabriel Pires</p>
				<h2 class="hero__heading">
					The Simple,<br>
					Clean<span class="u-sp-only"><br></span>
					Design
				</h2>
				<p class="hero__lead t-text">
					Agency provides a full service range
					including technical skills, design,
					business understanding.
				</p>
			</div>
		</section>
		
		<section class="service ">
			<p class="service__title t-accent-text">Service</p>
		</section>
		
		<section class="portfolio">
			<p class="portfolio__title t-accent-text">Portfolio</p>
		</section>
		
		<section class="features">
			<p class="features__title t-accent-text">Features</p>
		</section>
		
		<section class="testimonials">
			<p class="testimonials__title t-accent-text">Testimonials</p>
		</section>
		
		<section class="faq">
			<p class="faq__title t-accent-text">FAQ</p>
		</section>
		
		<section class="blog">
			<p class="blog__title t-accent-text">Our Blog</p>
		</section>
		
		<section class="contact">
			<p class="contact__title t-accent-text">Contact</p>
		</section>
	</main>
</body>
</html>
